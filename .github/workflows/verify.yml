name: Verify
on:
  push:
  pull_request:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --no-audit --no-fund
      - name: Verify
        run: |
          set -o pipefail
          if ! npm run verify 2>&1 | tee verify.log; then
            # Logs can't always be downloaded, so repeat the tail as one annotation.
            msg=$(grep -v '^\s*$' verify.log | tail -60 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=verify failed::${msg}"
            exit 1
          fi
      # Publishes the built pages to the build-preview branch so they can be
      # reviewed without a local Node toolchain. Safe to delete later.
      - name: Publish build preview
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cd dist
          git init -q -b build-preview
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Build preview of ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" build-preview
